  google_nav_bar: ^5.0.7
  go_router: ^18.0.1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3

  build_runner: ^2.4.15
  frontend_server_client: ^4.0.0
  
  # Hive CE Generator
  hive_ce_generator: ^1.8.0

flutter:
