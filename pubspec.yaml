name: e_commerce_app
description: A new Flutter project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0" 

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Dependency Injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Networking & Data
  http: ^1.6.0
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.2.2
  equatable: ^2.0.5

  # UI & UX
  flutter_svg: ^2.0.10
  skeletonizer: ^3.0.0
  flutter_native_splash: ^2.4.0
  smooth_page_indicator: ^3.0.0
  animate_do: ^5.1.0
  toastification: ^3.2.0
